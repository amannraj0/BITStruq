    const SandboxView = ({ showToast }) => {
      const defaultQuery = "CREATE TABLE Emp(id INT, name STRING, score INT);\nINSERT INTO Emp VALUES (1, 'Aman', 92), (2, 'Ananya', 96);\nSELECT * FROM Emp ORDER BY score DESC;";
      const [query, setQuery] = useState(defaultQuery);
      const [result, setResult] = useState([]);
      const [message, setMessage] = useState("Ready");
      const [error, setError] = useState("");
      const [running, setRunning] = useState(false);
      const [history, setHistory] = useState(() => load(SQL_BACKUP_KEY, []));

      useEffect(() => {
        try {
          alasql("CREATE DATABASE IF NOT EXISTS bit_db; USE bit_db;");
          history.forEach(sql => { try { alasql(sql); } catch (e) {} });
        } catch (e) {}
      }, []);

      const templates = [
        ["Starter", defaultQuery],
        ["Join", "CREATE TABLE Dept(id INT, dept STRING);\nINSERT INTO Dept VALUES (1, 'CSE'), (2, 'ECE');\nSELECT Emp.name, Dept.dept FROM Emp JOIN Dept ON Emp.id = Dept.id;"],
        ["Group", "SELECT score, COUNT(*) AS total FROM Emp GROUP BY score;"],
        ["Clean", "DROP TABLE IF EXISTS Emp;"]
      ];

      const execute = () => {
        if (!query.trim()) return;
        setRunning(true);
        setError("");
        setResult([]);
        setMessage("Running");

        setTimeout(() => {
          try {
            const response = alasql(query);
            const looksLikeRows = (value) =>
              Array.isArray(value) &&
              (value.length === 0 || (typeof value[0] === "object" && value[0] !== null && !Array.isArray(value[0])));
            let data = [];
            if (looksLikeRows(response)) {
              data = response;
            } else if (Array.isArray(response)) {
              const rowSets = response.filter(looksLikeRows);
              data = rowSets.length ? rowSets[rowSets.length - 1] : [];
            }

            if (/^\s*(CREATE|INSERT|UPDATE|DELETE|DROP|ALTER)\b/i.test(query)) {
              const updated = [query, ...history.filter(item => item !== query)].slice(0, 8);
              setHistory(updated);
              save(SQL_BACKUP_KEY, updated);
            }

            setResult(data);
            const expectsRows = /\b(SELECT|SHOW|WITH)\b/i.test(query);
            setMessage(data.length || expectsRows ? `Query OK - ${data.length} row${data.length === 1 ? "" : "s"}` : "Query executed");
          } catch (err) {
            setError(err.message);
            setMessage("Query failed");
          } finally {
            setRunning(false);
          }
        }, 350);
      };

      const reset = () => {
        try {
          alasql("DROP DATABASE IF EXISTS bit_db; CREATE DATABASE bit_db; USE bit_db;");
        } catch (e) {}
        setHistory([]);
        save(SQL_BACKUP_KEY, []);
        setResult([]);
        setError("");
        setMessage("Database reset");
        showToast("Database reset");
      };

      return (
        <>
          <AIAssistant contextArea="SQL" onApplyCode={setQuery} showToast={showToast} />

                </div>
                <button className="btn btn-danger px-4" onClick={reset}>
                  <Icon name="fa-rotate-left" /> Reset
                </button>
              </div>

              <div className="flex flex-wrap gap-2">

                  <button key={name} className="chip hover:border-cyan-300/40" onClick={() => setQuery(sql)}>{name}</button>
                ))}
              </div>

              <div className="surface overflow-hidden rounded-lg">
                <textarea className="code-editor border-0 bg-transparent" value={query} onChange={event => setQuery(event.target.value)} />
                <div className="flex flex-wrap items-center justify-between gap-3 border-t border-white/10 p-3">
                  <span className="text-sm font-bold text-slate-500">{query.split("\n").length} lines</span>
                  <button className="btn btn-primary px-6" onClick={execute} disabled={running}>
                    <Icon name={running ? "fa-circle-notch fa-spin" : "fa-play"} /> {running ? "Running" : "Execute"}
                  </button>
                </div>
              </div>

                <div className="surface rounded-lg p-4">
                  <div className="mb-3 text-xs font-black uppercase tracking-[.18em] text-slate-500">Recent schema changes</div>
                  <div className="grid gap-2">
                    {history.slice(0, 4).map((item, index) => (
                      <button key={index} onClick={() => setQuery(item)} className="truncate rounded-lg border border-white/10 bg-white/[.035] px-3 py-2 text-left mono text-xs text-slate-400 hover:text-white">
                        {item}

                  </div>
                </div>

                </span>
              </div>

                    <div className="text-center">
                      <Icon name="fa-circle-notch fa-spin" className="mb-3 text-3xl" />
                      <div className="font-black">Executing query</div>
                    </div>
                  </div>

                {!running && error && (

    const PlaygroundView = ({ showToast }) => {
      const languages = {
        "92": { name: "Python 3", label: "Python", template: "print('Hello BITStruq')" },
        "50": { name: "C (GCC)", label: "C", template: "#include <stdio.h>\nint main(){\n  printf(\"Hello BITStruq\");\n  return 0;\n}" },
        "54": { name: "C++ (GCC)", label: "C++", template: "#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n  cout << \"Hello BITStruq\";\n  return 0;\n}" },
        "62": { name: "Java", label: "Java", template: "class Main {\n  public static void main(String[] args) {\n    System.out.println(\"Hello BITStruq\");\n  }\n}" }
      };

      const [language, setLanguage] = useState("92");
      const [code, setCode] = useState(languages["92"].template);
      const [stdin, setStdin] = useState("");
      const [output, setOutput] = useState("Awaiting execution...");
      const [status, setStatus] = useState("Idle");
      const [running, setRunning] = useState(false);

      const toBase64 = (str) => btoa(unescape(encodeURIComponent(str || "")));
      const fromBase64 = (str) => {
        try {
          const decoded = atob((str || "").replace(/\s/g, ""));
          try { return decodeURIComponent(escape(decoded)); } catch (e) { return decoded; }
        } catch (e) {
          return str || "";
        }
      };

      const run = async () => {
        setRunning(true);
        setOutput("");
        setStatus("Executing...");

        try {
          // Send request securely to backend
          const response = await fetch(`https://bitstruq-backend.onrender.com/api/execute`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              language_id: Number(language),
              source_code: toBase64(code),
              stdin: toBase64(stdin)
            })
          });

          if (!response.ok) throw new Error(`Execution failed: ${response.status}`);
          const result = await response.json();

          const chunks = [
            fromBase64(result.compile_output),
            fromBase64(result.stdout),
            fromBase64(result.stderr),
            result.message
          ].filter(Boolean);

          setOutput(chunks.join("\n") || "No output");
          setStatus("Completed");
        } catch (error) {
          setOutput(`Execution error: ${error.message}`);
          setStatus("Failed");
        } finally {
          setRunning(false);
        }
      };

      const switchLanguage = (id) => {
        setLanguage(id);
        setCode(languages[id].template);
      };

                  <Icon name={running ? "fa-circle-notch fa-spin" : "fa-play"} /> {running ? "Running" : "Run"}
                </button>
              </div>

              <div className="surface rounded-lg p-3">
                <div className="grid gap-2 sm:grid-cols-4">
                  {Object.entries(languages).map(([id, item]) => (
                    <button key={id} onClick={() => switchLanguage(id)} className={`rounded-lg px-3 py-2 text-sm font-black ${language === id ? "bg-cyan-300 text-slate-950" : "bg-white/[.05] text-slate-300"}`}>
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>

              <textarea className="code-editor" value={code} onChange={event => setCode(event.target.value)} spellCheck="false"></textarea>

              <div className="flex flex-wrap gap-2 text-sm font-bold text-slate-500">
                <span className="chip">{code.split("\n").length} lines</span>

              </div>

                <div className="mb-3 flex items-center justify-between">

                  <span className="chip"><Icon name={running ? "fa-circle-notch fa-spin" : "fa-terminal"} /> {status}</span>
                </div>
                <pre className="scrollbar mono min-h-[380px] overflow-auto whitespace-pre-wrap rounded-lg border border-white/10 bg-black/55 p-4 text-sm text-emerald-300">{output}</pre>
              </div>
            </section>
          </main>
        </>
      );

        <>
          <main className="relative z-10 mx-auto w-full max-w-5xl px-4 py-8 sm:px-6">
            <div className="mb-7 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="text-3xl font-black text-white">Campus Exchange</h1>
                <p className="mt-1 text-sm font-semibold text-slate-400">Placement and internship experience board.</p>
              </div>
              <button className="btn btn-primary px-5" onClick={() => setOpen(true)}>
                <Icon name="fa-plus" /> Share
              </button>
            </div>

            <div className="surface mb-5 rounded-lg p-3">
              <input className="input" value={query} onChange={event => setQuery(event.target.value)} placeholder="Search company, role, tag" />
            </div>

            <div className="grid gap-4">
              {filtered.length === 0 && <div className="text-center text-slate-500 py-10">No experiences found yet. Be the first to share!</div>}
              {filtered.map(item => (
                <article key={item.id} className="card p-5">
                  <div className="mb-4 flex flex-wrap items-start justify-between gap-3">
                    <div>
                      <h2 className="text-xl font-black text-white">{item.company} <span className="text-cyan-200">- {item.role}</span></h2>
                      <p className="mt-1 text-sm font-bold text-slate-500">by {item.author || "Anonymous"}</p>
                    </div>
                    <span className="chip"><Icon name="fa-briefcase" /> Experience</span>
                  </div>
                  <p className="leading-7 text-slate-300">{item.experience}</p>
                  {item.tags && (
                    <div className="mt-4 flex flex-wrap gap-2">
                      {item.tags.split(",").map(tag => <span key={tag} className="chip">{tag.trim()}</span>)}
                    </div>
                  )}
                </article>
              ))}
            </div>
          </main>

          {open && (
            <Modal title="Share Experience" onClose={() => setOpen(false)} wide>
              <form onSubmit={submit} className="grid gap-4 sm:grid-cols-2">
                <input className="input" required placeholder="Company" value={form.company} onChange={event => setForm({...form, company: event.target.value})} />
                <input className="input" required placeholder="Role" value={form.role} onChange={event => setForm({...form, role: event.target.value})} />
                <input className="input" placeholder="Your name" value={form.author} onChange={event => setForm({...form, author: event.target.value})} />
                <input className="input" placeholder="Tags" value={form.tags} onChange={event => setForm({...form, tags: event.target.value})} />
                <textarea className="textarea sm:col-span-2" required placeholder="Experience" value={form.experience} onChange={event => setForm({...form, experience: event.target.value})}></textarea>
                <button className="btn btn-primary sm:col-span-2" type="submit">
                  <Icon name="fa-cloud-arrow-up" /> Submit to Cloud
                </button>
              </form>
            </Modal>
          )}
        </>
      );
    };

    const Footer = ({ onAdminTrigger }) => {
      const [feedbackOpen, setFeedbackOpen] = useState(false);
      const [contactOpen, setContactOpen] = useState(false);
      const [feedbackText, setFeedbackText] = useState("");
      const [contact, setContact] = useState({ name: "", message: "" });

      const submitFeedback = () => {
        if (!feedbackText.trim()) return;
        const updated = [{ text: feedbackText, date: new Date().toISOString() }, ...load(FEEDBACK_KEY, [])];
        save(FEEDBACK_KEY, updated);
        setFeedbackText("");
        setFeedbackOpen(false);
      };

      const submitContact = () => {
        if (!contact.message.trim()) return;
        const updated = [{ name: contact.name, msg: contact.message, date: new Date().toISOString() }, ...load(CONTACT_KEY, [])];
        save(CONTACT_KEY, updated);
        setContact({ name: "", message: "" });
        setContactOpen(false);
      };

      return (
        <footer className="relative z-10 mt-12 border-t border-white/10 bg-[#07090f]/70">
          <div className="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-6 sm:px-6 md:flex-row md:items-center md:justify-between">
            <div className="text-sm font-semibold text-slate-500">
              (c) BITStruq by <button onClick={onAdminTrigger} className="font-black text-cyan-300 hover:text-white">Aman Raj</button>
            </div>
            <div className="flex flex-wrap gap-2">
              <button className="btn btn-secondary px-4" onClick={() => setFeedbackOpen(true)}><Icon name="fa-comment" /> Feedback</button>
              <button className="btn btn-secondary px-4" onClick={() => setContactOpen(true)}><Icon name="fa-envelope" /> Contact</button>
              <a className="btn btn-secondary px-4" href="https://www.linkedin.com/in/aman-raj-a46aa431b" target="_blank" rel="noreferrer">
                <i className="fa-brands fa-linkedin"></i> LinkedIn
              </a>
            </div>
          </div>

          {feedbackOpen && (
            <Modal title="Feedback" onClose={() => setFeedbackOpen(false)}>
              <textarea className="textarea" value={feedbackText} onChange={event => setFeedbackText(event.target.value)} placeholder="Your suggestions"></textarea>
              <button className="btn btn-primary mt-4 w-full" onClick={submitFeedback}>Submit</button>
            </Modal>
          )}

          {contactOpen && (
            <Modal title="Contact Developer" onClose={() => setContactOpen(false)}>
              <div className="space-y-3">
                <input className="input" value={contact.name} onChange={event => setContact({...contact, name: event.target.value})} placeholder="Your name" />
                <textarea className="textarea" value={contact.message} onChange={event => setContact({...contact, message: event.target.value})} placeholder="Message"></textarea>
                <button className="btn btn-primary w-full" onClick={submitContact}>Send</button>
              </div>
            </Modal>
          )}
        </footer>
      );
    };

    const AdminPanel = ({ onClose }) => {
      const [feedbacks] = useState(() => load(FEEDBACK_KEY, []));
      const [contacts] = useState(() => load(CONTACT_KEY, []));

      return (
        <Modal title="Admin Panel" onClose={onClose} wide>
          <div className="grid gap-5 md:grid-cols-2">
            <section>
              <h4 className="mb-3 font-black text-cyan-200">Feedbacks ({feedbacks.length})</h4>
              <div className="grid gap-2">
                {feedbacks.length === 0 && <div className="text-sm text-slate-500">No feedback yet.</div>}
                {feedbacks.map((item, index) => (
                  <div key={index} className="rounded-lg border border-white/10 bg-black/35 p-3 text-sm text-slate-300">
                    {item.text}
                    <div className="mt-2 text-xs text-slate-600">{new Date(item.date).toLocaleString()}</div>
                  </div>
                ))}
              </div>
            </section>
            <section>
              <h4 className="mb-3 font-black text-cyan-200">Contacts ({contacts.length})</h4>
              <div className="grid gap-2">
                {contacts.length === 0 && <div className="text-sm text-slate-500">No contacts yet.</div>}
                {contacts.map((item, index) => (
                  <div key={index} className="rounded-lg border border-white/10 bg-black/35 p-3 text-sm text-slate-300">
                    <strong className="text-white">{item.name || "Anonymous"}</strong>: {item.msg}
                    <div className="mt-2 text-xs text-slate-600">{new Date(item.date).toLocaleString()}</div>
                  </div>
                ))}
              </div>
            </section>
          </div>
        </Modal>
      );
    };

    function App() {
      const [currentView, setCurrentView] = useState("loading");
      const [adminOpen, setAdminOpen] = useState(false);
      const { toast, showToast } = useToast();

      useEffect(() => {
        const timer = setTimeout(() => setCurrentView("home"), 1600);
        return () => clearTimeout(timer);
      }, []);

      const handleAdmin = () => {
        const pass = prompt("Enter admin password:");
        if (pass === "bitstruq") setAdminOpen(true);
        else if (pass !== null) alert("Wrong password");
      };

      if (currentView === "loading") return <LoadingScreen />;

      return (
        <div className="app-shell">
          <Navbar currentView={currentView} setCurrentView={setCurrentView} />

          {currentView === "home" && <HomePage setCurrentView={setCurrentView} />}
          {currentView === "sandbox" && <SandboxView showToast={showToast} />}
          {currentView === "vault" && <VaultView showToast={showToast} />}
          {currentView === "playground" && <PlaygroundView showToast={showToast} />}
          {currentView === "exchange" && <ExchangeView showToast={showToast} />}

          <Footer onAdminTrigger={handleAdmin} />

          {adminOpen && <AdminPanel onClose={() => setAdminOpen(false)} />}
          <Toast message={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
